[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian"
version = "0.0.2"
dependencies = [
    "numpy<2",
    "alphashape",
    "trimesh",
    "manifold3d",
    "rasterio<1.5",
    "circle-fit",
    "segment-anything",
    "einops",
    "fast-pytorch-kmeans",
    "open3d",
    "transformers",
    "numba",
    "yolov7-package",
    "robotdatapy"
    # for dinov3
    #"torchmetrics",
    #"termcolor",
    #"segment_anything @ git+https://github.com/facebookresearch/segment-anything.git"
]
requires-python = ">=3.8"
authors = [
    {name = "Mason Peterson", email = "mbpeterson70@gmail.com"}
]
description = "Package for matching general segments (object and non-object)."
readme = "README.md"
license = "MIT"


