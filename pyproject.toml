[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian"
version = "0.0.2"
dependencies = [
    "numpy<2",
    "alphashape",
    "trimesh",
    "manifold3d",
    "rasterio<1.5",
    "circle-fit",
    "segment-anything",
    "einops",
    "fast-pytorch-kmeans",
    "open3d",
    "transformers",
    "numba",
    "yolov7-package",
    "robotdatapy",
    "gdown",
    # for dinov3
    #"torchmetrics",
    #"termcolor",
    #"segment_anything @ git+https://github.com/facebookresearch/segment-anything.git"
]
requires-python = ">=3.8"
authors = [
    {name = "Mason Peterson", email = "mbpeterson70@gmail.com"},
    {name = "Andy Li", email = "andyli27@mit.edu"}
]
description = "Package for localizing a ground robot from aerial ortho-imagery, providing meter-level pose estimates without any initial pose information or environmental fine-tuning."
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
# ROS-side tooling that runs in the meridian env but isn't imported by the core
# library -- e.g. the ros_system_monitor status table, which needs spark_config.
# Install with:  pip install -e '.[ros]'
ros = [
    "spark_config @ git+https://github.com/MIT-SPARK/Spark-Config.git",
]

# Allow the git+https direct reference above (hatchling blocks direct URL
# references by default).
[tool.hatch.metadata]
allow-direct-references = true


